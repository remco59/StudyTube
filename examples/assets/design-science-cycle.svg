<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Design Science cycle</title>
  <desc id="desc">Five connected stages: Understand, Ground, Build, Evaluate and Learn.</desc>
  <rect width="1200" height="700" rx="48" fill="#11151b"/>
  <text x="600" y="92" text-anchor="middle" fill="#f4f1e8" font-family="Arial, sans-serif" font-size="50" font-weight="700">Design Science-cyclus</text>
  <g font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    <g transform="translate(180 350)"><circle r="92" fill="#2b254a" stroke="#a99cff" stroke-width="4"/><text y="8" fill="#f4f1e8">Begrijpen</text></g>
    <g transform="translate(390 210)"><circle r="92" fill="#252b39" stroke="#7ed8ff" stroke-width="4"/><text y="8" fill="#f4f1e8">Onderbouwen</text></g>
    <g transform="translate(650 210)"><circle r="92" fill="#2b254a" stroke="#a99cff" stroke-width="4"/><text y="8" fill="#f4f1e8">Bouwen</text></g>
    <g transform="translate(900 350)"><circle r="92" fill="#252b39" stroke="#7ed8ff" stroke-width="4"/><text y="8" fill="#f4f1e8">Evalueren</text></g>
    <g transform="translate(650 510)"><circle r="92" fill="#2b254a" stroke="#a99cff" stroke-width="4"/><text y="8" fill="#f4f1e8">Leren</text></g>
  </g>
