name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Test Intel FFmpeg compatibility wrapper
        run: |
          output="$(STUDYTUBE_FFMPEG_WRAPPER_PRINT_ARGS=1 node docker/ffmpeg-intel/ffmpeg -hide_banner -c:a libfdk_aac -b:a 320k)"
          echo "$output"
          echo "$output" | grep -q '"aac"'
          if echo "$output" | grep -q 'libfdk_aac'; then
            echo 'Intel FFmpeg wrapper did not replace libfdk_aac.'
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Ensure NVIDIA is not a hard startup requirement
        run: |
          if grep -Eq '^[[:space:]]+gpus:' docker-compose.yml; then
            echo 'Default docker-compose.yml must not require an NVIDIA runtime.'
            exit 1
          fi

      - name: Build containers
        run: docker compose build

      - name: Test Google Chirp token refresh recovery
        run: docker compose run --rm --no-deps cloud-tts python -m unittest -v test_server
