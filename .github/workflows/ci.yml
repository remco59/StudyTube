name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Ensure NVIDIA is not a hard startup requirement
        run: |
          if grep -Eq '^[[:space:]]+gpus:' docker-compose.yml; then
            echo 'Default docker-compose.yml must not require an NVIDIA runtime.'
            exit 1
          fi

      - name: Build containers
        run: docker compose build
